<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="default"><meta name="apple-mobile-web-app-title" content="Академия"><meta name="theme-color" content="#E0633F">
<link rel="apple-touch-icon" href="icon-180.png"><link rel="icon" href="icon-192.png"><link rel="manifest" href="manifest.json">
<style>:root{padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom)}</style></head><body><title>Римская академия Варвары</title>

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&family=Nunito:wght@500;700;900&display=swap">
<style>
/* Layout: one-screen app, hub of 6 "temples" (games), each game full-screen with a top bar; big tap targets for a 7-year-old on a phone. Single bright theme: Roman terracotta + travertine + Tyrrhenian blue. */
:root{
  --bg:#FFF4E3; --card:#FFFFFF; --ink:#2B2A33; --muted:#7C6F64;
  --terra:#D9603B; --ochre:#F2B134; --sea:#2F8FBF; --olive:#6FA66B; --wine:#8A3A62; --marble:#F0E6D2;
  --shadow:0 6px 0 #E3CDB0;
  --display:"Baloo 2","Nunito",system-ui,sans-serif; --body:"Nunito",system-ui,sans-serif;
  color-scheme:light;
}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-weight:700;font-size:17px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:10px;
  -webkit-tap-highlight-color:transparent;user-select:none;overflow-x:hidden}
*{box-sizing:border-box}
button{font:inherit;cursor:pointer;border:0;border-radius:18px;background:var(--card);color:var(--ink);box-shadow:var(--shadow);padding:14px 18px;font-weight:900;transition:transform .08s}
button:active{transform:translateY(3px);box-shadow:0 3px 0 #E3CDB0}
button:focus-visible{outline:3px solid var(--sea);outline-offset:2px}
.screen{display:none;max-width:560px;margin:0 auto;min-height:100%}
.screen.on{display:flex;flex-direction:column;gap:14px}
h1,h2{font-family:var(--display);margin:0;text-wrap:balance;line-height:1.05}
h1{font-size:30px;color:var(--terra)} h2{font-size:24px}
.top{display:flex;align-items:center;gap:10px}
.top .back{padding:10px 14px;border-radius:14px}
.top h2{flex:1}
.stars{display:flex;align-items:center;gap:6px;background:var(--card);border-radius:999px;padding:6px 12px;box-shadow:var(--shadow);font-family:var(--display);font-size:20px}
.stars svg{width:22px;height:22px}
.hero{background:linear-gradient(160deg,var(--terra),#B8452A);color:#fff;border-radius:26px;padding:18px 20px;display:flex;gap:14px;align-items:center;box-shadow:0 8px 0 #9E3A22}
.hero h1{color:#fff} .hero p{margin:4px 0 0;font-weight:700;opacity:.95}
.hero .av{width:64px;height:64px;flex:none}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.tile{display:flex;flex-direction:column;align-items:center;gap:6px;padding:16px 10px 14px;border-radius:22px;text-align:center}
.tile svg{width:58px;height:58px}
.tile .n{font-family:var(--display);font-size:18px;line-height:1.1}
.tile .s{font-size:13px;color:var(--muted);font-weight:700}
.tile .s b{color:var(--ochre)}
.mosaic{background:var(--card);border-radius:22px;padding:14px;box-shadow:var(--shadow)}
.mosaic .mt{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:8px}
.mosaic .mt span{color:var(--muted);font-size:14px}
.mgrid{display:grid;grid-template-columns:repeat(6,1fr);gap:4px;aspect-ratio:6/3;max-width:100%}
.mgrid i{border-radius:5px;background:var(--marble);display:block}
.mgrid i.on{background:var(--c)}
.card{background:var(--card);border-radius:22px;padding:18px;box-shadow:var(--shadow)}
.prompt{font-size:22px;line-height:1.3;text-align:center}
.prompt.big{font-family:var(--display);font-size:40px}
.opts{display:grid;gap:10px}
.opts button{font-size:20px;padding:16px;border:3px solid transparent}
.opts button.ok{background:#E3F3DE;border-color:var(--olive)}
.opts button.bad{background:#FBE0D8;border-color:var(--terra)}
.row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.letters button{width:56px;height:56px;padding:0;font-size:26px;font-family:var(--display);border-radius:14px}
.letters button.used{opacity:.25}
.answer{min-height:60px;display:flex;gap:6px;justify-content:center;flex-wrap:wrap}
.answer span{width:44px;height:52px;border-bottom:4px solid var(--terra);display:flex;align-items:flex-end;justify-content:center;font-family:var(--display);font-size:30px;padding-bottom:2px}
.pb{height:12px;background:var(--marble);border-radius:999px;overflow:hidden}
.pb i{display:block;height:100%;background:var(--ochre);border-radius:999px;transition:width .3s}
.fb{text-align:center;font-family:var(--display);font-size:22px;min-height:30px;color:var(--olive)}
.fb.bad{color:var(--terra)}
.primary{background:var(--terra);color:#fff;box-shadow:0 6px 0 #9E3A22;font-size:20px}
.primary:active{box-shadow:0 3px 0 #9E3A22}
.ghost{background:var(--marble);box-shadow:0 6px 0 #D9C8A8}
.coins{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.coin{width:66px;height:66px;border-radius:50%;padding:0;font-family:var(--display);font-size:20px;background:radial-gradient(circle at 35% 35%,#FFE38A,#E0A62B);box-shadow:0 5px 0 #A8780F;color:#5A3E00}
.coin.b{border-radius:14px;width:84px;height:52px;background:linear-gradient(135deg,#BFE5F5,#5EAFD6);box-shadow:0 5px 0 #2E6F8E;color:#0E3A52}
.coin.b.ten{background:linear-gradient(135deg,#FBD3D3,#E57373);box-shadow:0 5px 0 #9E3A3A;color:#5A1515}
.paid{display:flex;justify-content:space-between;align-items:center;font-size:22px;font-family:var(--display)}
.paid b{color:var(--sea)}
.item{display:flex;align-items:center;gap:14px;justify-content:center}
.item svg{width:84px;height:84px}
.item .price{font-family:var(--display);font-size:36px;color:var(--terra)}
canvas.trace{width:100%;height:auto;background:#fff;border-radius:18px;touch-action:none;display:block;border:3px dashed var(--marble)}
.mem{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.mem button{aspect-ratio:1;padding:4px;border-radius:16px;background:var(--sea);box-shadow:0 5px 0 #1F6687;display:flex;align-items:center;justify-content:center;font-family:var(--display);font-size:14px;color:#fff;line-height:1.05}
.mem button.open{background:#fff;color:var(--ink);box-shadow:var(--shadow)}
.mem button.done{background:#E3F3DE;color:var(--olive);box-shadow:0 5px 0 #B9D9B3}
.mem button svg{width:70%;height:70%}
.win{text-align:center;display:flex;flex-direction:column;gap:12px;align-items:center}
.win .big{font-family:var(--display);font-size:34px;color:var(--terra)}
.win svg{width:120px;height:120px}
.rom{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.rom div{background:var(--marble);border-radius:10px;text-align:center;padding:6px 0;font-size:13px}
.rom div b{display:block;font-family:var(--display);font-size:18px;color:var(--terra)}
.small{color:var(--muted);font-size:14px;text-align:center;font-weight:700}
.pix{display:grid;grid-template-columns:repeat(12,1fr);gap:2px;max-width:100%;touch-action:none}
.pc{aspect-ratio:1;padding:0;border-radius:4px;box-shadow:none;background:#fff;border:1px solid #E3CDB0;font-size:13px;font-weight:900;color:#9A8C7E;min-width:0}
.pc.empty{background:transparent;border-color:transparent}.pc.done{border-color:transparent}
.pc.shake{animation:sh .3s}@keyframes sh{25%{transform:translateX(-3px)}75%{transform:translateX(3px)}}
.pal{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.pal button{width:52px;height:52px;border-radius:14px;padding:0;font-family:var(--display);font-size:20px;border:4px solid transparent}
.pal button.on{border-color:var(--ink);transform:scale(1.08)}
.bpal{display:flex;gap:6px;overflow-x:auto;padding:4px 2px}
.bb{flex:none;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 8px;border-radius:12px;font-size:11px;border:3px solid transparent;line-height:1.1}
.bb.on{border-color:var(--terra)}.bb.lock{opacity:.5}.bb canvas{image-rendering:pixelated;border-radius:4px}
.seg{display:flex;gap:6px}.seg button{flex:1;box-shadow:none;background:var(--marble);padding:10px;border-radius:12px;font-size:15px}.seg button.on{background:var(--terra);color:#fff}
.seg.mini{margin-top:6px}.seg.mini button{padding:5px;font-size:13px;border-radius:8px;max-width:48px}
.pix.ref{width:132px;max-width:100%;margin:0 auto;gap:1px;pointer-events:none;background:#fff;padding:4px;border-radius:8px;border:2px solid var(--marble)}.pix.ref i{aspect-ratio:1;display:block;border-radius:1px;min-height:8px}
.house{display:flex;flex-direction:column;align-items:center;margin:4px auto}
.roof{width:0;height:0;border-left:90px solid transparent;border-right:90px solid transparent;border-bottom:70px solid var(--terra);position:relative}
.roof::after{content:attr(data-n)}
.house .roof{color:#fff;font-family:var(--display);font-size:34px;display:flex;align-items:flex-end;justify-content:center;width:180px;height:70px;border:0;background:var(--terra);clip-path:polygon(50% 0,100% 100%,0 100%);padding-bottom:4px;box-sizing:border-box}
.rooms{background:var(--marble);border-radius:0 0 18px 18px;padding:12px 16px;min-width:180px;display:flex;flex-wrap:wrap;gap:8px;justify-content:center;align-items:center}
.room{width:64px;height:56px;background:#fff;border-radius:12px;display:flex;align-items:center;justify-content:center;font-family:var(--display);font-size:28px;box-shadow:var(--shadow)}
.room b{color:var(--terra)}
.plus{font-family:var(--display);font-size:26px}
.pair{display:flex;align-items:center;gap:6px;font-family:var(--display);font-size:20px;background:#fff;border-radius:12px;padding:6px 10px;box-shadow:var(--shadow)}
.pair span{width:34px;height:34px;border-bottom:3px solid var(--terra);display:inline-flex;align-items:center;justify-content:center}
.scene{position:relative;border-radius:18px;overflow:hidden;box-shadow:var(--shadow);border:3px solid #5B4636;background:#000;touch-action:none}
.scene svg{display:block;width:100%;height:auto}
.scene .item.cur{filter:drop-shadow(0 0 6px #F2B134)}
.itool{position:absolute;transform:translateX(-50%);display:flex;gap:4px;background:#fff;border-radius:12px;padding:4px;box-shadow:0 3px 0 #B9A98F}
.itool button{width:36px;height:36px;padding:0;border-radius:9px;box-shadow:none;background:var(--marble);font-size:18px}
.roomwrap{background:#fff;border-radius:18px;padding:8px;box-shadow:var(--shadow)}
.room3d{display:grid;grid-template-columns:repeat(10,1fr);gap:1px;border-radius:12px;overflow:hidden;border:3px solid #5B4636}
.rc{aspect-ratio:1;display:flex;align-items:center;justify-content:center;cursor:pointer}
.rc.wall{background:var(--wall)}.rc.floor{background:var(--floor);background-image:linear-gradient(rgba(0,0,0,.08) 1px,transparent 1px);background-size:100% 50%}
.rc svg{width:92%;height:92%}
.rowc{display:flex;align-items:center;gap:4px;flex-wrap:wrap;justify-content:center}
.swatch{width:26px;height:26px;border-radius:50%;padding:0;box-shadow:none;border:2px solid #5B4636}
.board8{display:grid;grid-template-columns:repeat(8,1fr);border:4px solid #5B4636;border-radius:8px;overflow:hidden;max-width:420px;margin:0 auto;width:100%}
.sq{aspect-ratio:1;display:flex;align-items:center;justify-content:center;position:relative}
.sq.light{background:#F0E6D2}.sq.dark{background:#B9A98F}
.sq.sel{outline:4px solid var(--ochre);outline-offset:-4px}
.sq.hint::after{content:"";width:30%;height:30%;border-radius:50%;background:rgba(47,143,191,.55);position:absolute}
.sq.goal{box-shadow:inset 0 0 0 3px rgba(111,166,107,.5)}
.pc{width:70%;height:70%;border-radius:50%;display:block;box-shadow:0 3px 0 rgba(0,0,0,.35)}
.pc.p1{background:radial-gradient(circle at 35% 35%,#FF8A80,#C62828)}.pc.p2{background:radial-gradient(circle at 35% 35%,#8ECAE6,#1F6687)}
.pawn{width:80%;height:80%;display:block}.pawn svg{width:100%;height:100%}
.pawn.bk svg circle,.pawn.bk svg path{fill:#5B4636}
.fb.small{font-size:14px;font-family:var(--body);font-weight:700;color:var(--muted)}
.modebar{display:flex;gap:8px;justify-content:center}.modebar button{padding:8px 14px;font-size:14px}.modebar button.on{background:var(--terra);color:#fff;box-shadow:0 6px 0 #9E3A22}
.chip{padding:6px 10px;font-size:13px;box-shadow:none;background:var(--marble)}.chip.on{background:var(--sea);color:#fff}
.scenebox{background:#fff;border-radius:18px;box-shadow:var(--shadow);padding:6px;touch-action:manipulation}
.scenebox svg{width:100%;height:auto;display:block}.scenebox .r{cursor:pointer}
.pal.big button{width:40px;height:40px;border-radius:12px}.pal .eraser{background:#fff;font-size:18px;color:#2B2A33;border:2px dashed #999}
.pc.sm{font-size:10px;border-radius:3px}
.confetti{position:fixed;inset:0;pointer-events:none;overflow:hidden}
.confetti i{position:absolute;top:-10px;width:10px;height:16px;border-radius:3px;animation:fall 1.6s linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(540deg)}}
.tabs[hidden]{display:none!important}
.tabs{position:fixed;left:0;right:0;bottom:0;display:flex;justify-content:center;gap:6px;background:#fff;box-shadow:0 -4px 0 #E3CDB0;padding:8px max(16px,env(safe-area-inset-right,0px)) calc(8px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));z-index:5}
.tabs button{flex:1;max-width:180px;box-shadow:none;background:transparent;border-radius:14px;padding:8px 4px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:13px;color:var(--muted)}
.tabs button svg{width:28px;height:28px}
.tabs button.on{background:var(--bg);color:var(--terra)}
.screen{padding-bottom:84px}
.prof{display:grid;gap:10px}
.prow{display:flex;align-items:center;gap:12px;background:var(--card);border-radius:18px;padding:10px 14px;box-shadow:var(--shadow)}
.prow svg{width:40px;height:40px}.prow .pn{flex:1}.prow .pbar{height:10px;background:var(--marble);border-radius:999px;overflow:hidden;margin-top:4px}.prow .pbar i{display:block;height:100%;background:var(--c);width:var(--w)}
.badges{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.badge{background:var(--card);border-radius:18px;padding:12px 8px;text-align:center;box-shadow:var(--shadow);font-size:13px;opacity:.35}
.badge.on{opacity:1}.badge svg{width:48px;height:48px}.badge b{display:block;font-family:var(--display);font-size:14px;margin-top:4px}
@media (prefers-reduced-motion:reduce){.confetti i{animation:none;display:none}}
</style>

<div class="confetti" id="confetti"></div>

<!-- ============ HUB ============ -->
<section class="screen on" id="s-hub">
  <div class="hero">
    <svg class="av" viewBox="0 0 100 100"><circle cx="50" cy="42" r="26" fill="#FFD6B0"/><rect x="30" y="66" width="40" height="30" rx="8" fill="#F2B134"/><rect x="18" y="38" width="8" height="30" rx="4" fill="#5B3A1E"/><rect x="74" y="38" width="8" height="30" rx="4" fill="#5B3A1E"/><path d="M26 30 q24 -22 48 0 v8 q-24 -10 -48 0z" fill="#5B3A1E"/><polygon points="28,24 38,10 50,22 62,10 72,24" fill="#FFD166" stroke="#C78A00" stroke-width="2"/><circle cx="42" cy="46" r="3" fill="#2B2A33"/><circle cx="58" cy="46" r="3" fill="#2B2A33"/><path d="M42 56 q8 7 16 0" fill="none" stroke="#2B2A33" stroke-width="3" stroke-linecap="round"/></svg>
    <div><h1>Римская академия</h1><p>Ученица: <b>Варвара</b> · класс гладиаторов</p></div>
  </div>
  <div class="top" style="justify-content:space-between">
    <div class="stars"><svg viewBox="0 0 100 100"><polygon points="50,6 61,38 95,38 67,58 78,92 50,72 22,92 33,58 5,38 39,38" fill="#F2B134"/></svg><span id="total">0</span></div>
    <div class="small">Собери звёзды — открой мозаику</div>
  </div>
  <div class="grid" id="tiles"></div>
</section>

<!-- ============ REWARDS ============ -->
<section class="screen" id="s-rew">
  <h1>Награды</h1>
  <div class="mosaic">
    <div class="mt"><h2>Мозаика «Волчица»</h2><span id="mos-info"></span></div>
    <div class="mgrid" id="mgrid"></div>
  </div>
  <h2>Значки</h2>
  <div class="badges" id="badges"></div>
</section>

<!-- ============ PROFILE ============ -->
<section class="screen" id="s-prof">
  <h1>Ученица Варвара</h1>
  <div class="card" style="display:flex;gap:14px;align-items:center"><div class="stars" style="font-size:26px"><svg viewBox="0 0 100 100"><polygon points="50,6 61,38 95,38 67,58 78,92 50,72 22,92 33,58 5,38 39,38" fill="#F2B134"/></svg><span id="ptotal">0</span></div><div><div style="font-family:var(--display);font-size:20px" id="rank"></div><div class="small" style="text-align:left">до следующего звания: <b id="torank"></b></div></div></div>
  <h2>Сложность</h2>
  <div class="card" style="display:flex;flex-direction:column;gap:10px">
    <div class="small" style="text-align:left">Для всех уроков сразу:</div>
    <div class="seg" data-g="all"><button data-l="1">Легко</button><button data-l="2">Средне</button><button data-l="3">Сложно</button></div>
    <div class="small" style="text-align:left">Или отдельно по предметам (нажми на урок ниже)</div>
  </div>
  <h2>Успехи по предметам</h2>
  <div class="prof" id="prof"></div>
  <button class="ghost" id="reset">Начать всё заново</button>
</section>

<nav class="tabs">
  <button data-t="s-hub" class="on"><svg viewBox="0 0 100 100"><rect x="14" y="40" width="72" height="46" rx="6" fill="currentColor" opacity=".25"/><polygon points="50,10 92,40 8,40" fill="currentColor"/><rect x="22" y="48" width="10" height="30" fill="currentColor"/><rect x="45" y="48" width="10" height="30" fill="currentColor"/><rect x="68" y="48" width="10" height="30" fill="currentColor"/></svg>Уроки</button>
  <button data-t="s-rew"><svg viewBox="0 0 100 100"><polygon points="50,8 61,38 95,38 67,58 78,92 50,72 22,92 33,58 5,38 39,38" fill="currentColor"/></svg>Награды</button>
  <button data-t="s-prof"><svg viewBox="0 0 100 100"><circle cx="50" cy="36" r="20" fill="currentColor"/><path d="M14 92 a36 30 0 0 1 72 0z" fill="currentColor"/></svg>Я</button>
</nav>

<!-- ============ GAME SHELL ============ -->
<section class="screen" id="s-game">
  <div class="top"><button class="back" id="back">←</button><h2 id="g-title"></h2><div class="stars"><svg viewBox="0 0 100 100"><polygon points="50,6 61,38 95,38 67,58 78,92 50,72 22,92 33,58 5,38 39,38" fill="#F2B134"/></svg><span id="g-stars">0</span></div></div>
  <div class="pb"><i id="pb" style="width:0%"></i></div>
  <div id="g-body" class="card" style="display:flex;flex-direction:column;gap:14px"></div>
</section>

<script>
// ---------- icons ----------
const I = {
 scroll:'<svg viewBox="0 0 100 100"><rect x="18" y="14" width="64" height="72" rx="8" fill="#F8E7C1" stroke="#8A5A2B" stroke-width="3"/><rect x="12" y="10" width="76" height="12" rx="6" fill="#D9603B"/><rect x="12" y="78" width="76" height="12" rx="6" fill="#D9603B"/><path d="M30 36h40M30 48h40M30 60h26" stroke="#8A5A2B" stroke-width="4" stroke-linecap="round"/></svg>',

try{ S = JSON.parse(localStorage.getItem('academy')||'null') || S; }catch(e){}
S.stars=S.stars||{}; S.lv=S.lv||{}; S.total=S.total||0;
function lvl(g){ return S.lv[g] || S.lv.all || 2; }
function save(){ try{localStorage.setItem('academy',JSON.stringify(S));}catch(e){} }
function addStar(g,n=1){ S.stars[g]=(S.stars[g]||0)+n; S.total+=n; save(); $('#g-stars').textContent=S.stars[g]; burst(); }
const $=s=>document.querySelector(s);
const shuffle=a=>a.map(x=>[Math.random(),x]).sort((p,q)=>p[0]-q[0]).map(p=>p[1]);
const pick=a=>a[Math.floor(Math.random()*a.length)];

// ---------- hub ----------
function renderHub(){
  $('#total').textContent=S.total;
  $('#tiles').innerHTML = GAMES.map(g=>`<button class="tile" data-g="${g.id}" style="--c:${g.color}">${I[g.icon]}<span class="n">${g.name}</span><span class="s">${g.sub} · <b>★ ${S.stars[g.id]||0}</b></span></button>`).join('');
  document.querySelectorAll('.tile').forEach(b=>b.onclick=()=>openGame(b.dataset.g));
}
function show(id){ document.querySelectorAll('.screen').forEach(s=>s.classList.remove('on')); $('#'+id).classList.add('on'); window.scrollTo(0,0);
  document.querySelectorAll('.tabs button').forEach(b=>b.classList.toggle('on',b.dataset.t===id)); document.querySelector('.tabs').hidden = (id==='s-game'); }
document.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>{ if(b.dataset.t==='s-rew') renderRew(); if(b.dataset.t==='s-prof') renderProf(); if(b.dataset.t==='s-hub') renderHub(); show(b.dataset.t); });
const RANKS=[[0,'Новичок'],[10,'Ученица'],[25,'Писарь'],[45,'Легионер'],[70,'Центурион'],[100,'Императрица Рима']];
const BADGES=[['scroll','Книгочей','read',5],['pen','Каллиграф','write',5],['coins','Торговец','market',5],['helmet','Гладиатор','roman',5],['flag','Итальянка','ital',5],['map','Картограф','memo',4],['house','Строитель чисел','bonds',8],['star','Звёздочка',null,10],['wolf','Волчица',null,54]];
function renderRew(){
  const cols=['#9C8A7A','#5B4636','#F2B134','#D9603B','#2F8FBF','#6FA66B'];
  const n=Math.min(18,Math.floor(S.total/3));
  $('#mgrid').innerHTML=Array.from({length:18},(_,i)=>`<i class="${i<n?'on':''}" style="--c:${cols[i%6]}"></i>`).join('');
  $('#mos-info').textContent = n>=18 ? 'Собрана! Молодец!' : `${n} из 18 · каждые 3 звезды = кусочек`;
  $('#badges').innerHTML=BADGES.map(([ic,name,g,need])=>{ const have=g?(S.stars[g]||0):S.total; return `<div class="badge ${have>=need?'on':''}">${I[ic]}<b>${name}</b>${have>=need?'получен':`${Math.min(have,need)} / ${need}`}</div>`; }).join('');
}
function renderProf(){
  $('#ptotal').textContent=S.total;
  let r=RANKS[0], nx=null; for(const x of RANKS){ if(S.total>=x[0]) r=x; else { nx=x; break; } }
  $('#rank').textContent=r[1]; $('#torank').textContent= nx ? `${nx[0]-S.total} ★ (${nx[1]})` : 'ты на вершине!';
  $('#prof').innerHTML=GAMES.filter(g=>g.id!=='build').map(g=>{ const v=S.stars[g.id]||0; return `<div class="prow" style="--c:${g.color};--w:${Math.min(100,v*5)}%">${I[g.icon]}<div class="pn"><div>${g.name} · <b>★ ${v}</b></div><div class="pbar"><i></i></div><div class="seg mini" data-g="${g.id}"><button data-l="1">1</button><button data-l="2">2</button><button data-l="3">3</button></div></div></div>`; }).join('');
  syncSeg();
}
function syncSeg(){ document.querySelectorAll('.seg').forEach(sg=>{ const g=sg.dataset.g; const v = g==='all' ? (S.lv.all||2) : lvl(g); sg.querySelectorAll('button').forEach(b=>b.classList.toggle('on',+b.dataset.l===v)); }); }
document.addEventListener('click',e=>{ const b=e.target.closest('.seg button'); if(!b) return; const g=b.closest('.seg').dataset.g; if(g==='all'){ S.lv={all:+b.dataset.l}; } else S.lv[g]=+b.dataset.l; save(); syncSeg(); });
$('#reset').onclick=()=>{ if($('#reset').dataset.sure){ S={stars:{},total:0}; save(); renderProf(); $('#reset').textContent='Начать всё заново'; delete $('#reset').dataset.sure; } else { $('#reset').dataset.sure='1'; $('#reset').textContent='Точно? Нажми ещё раз'; } };
$('#back').onclick=()=>{ renderHub(); show('s-hub'); };

let cur=null, round=0, ROUNDS=5;
const ROUNDS_BY={read:6,color:1,build:1,arena:1,clock:5,dict:5,bonds:6,room:1,corners:1,pawns:1};
function openGame(id){
  cur=id; round=0; ROUNDS=ROUNDS_BY[id]||5; const g=GAMES.find(x=>x.id===id);
  $('#g-title').textContent=g.name; $('#g-stars').textContent=S.stars[id]||0;
  show('s-game'); try{ next(); }catch(err){ body('<div class="fb bad">Ой, урок не открылся. Нажми ← и попробуй другой</div>'); console.error(err); }
}
function progress(){ $('#pb').style.width=(round/ROUNDS*100)+'%'; }
function next(){
  progress();
  if(round>=ROUNDS){ return finish(); }
  ({read:qRead, write:qWrite, market:qMarket, roman:qRoman, ital:qItal, memo:qMemo, color:qColor, build:qBuild, clock:qClock, arena:qArena, dict:qDict, bonds:qBonds, room:qRoom, corners:qCorners, pawns:qPawns})[cur]();
}
function finish(){
  $('#g-body').innerHTML=`<div class="win">${I.star}<div class="big">Урок пройден!</div><div>Ты заработала звёзды. Так держать, римлянка!</div><button class="primary" id="again">Ещё раз</button><button class="ghost" id="home">К академии</button></div>`;
  $('#again').onclick=()=>{round=0;next();}; $('#home').onclick=()=>{renderHub();show('s-hub');};
}
function body(html){ $('#g-body').innerHTML=html; }
function feedback(ok,msg){ const f=$('#fb'); if(f){ f.textContent=msg||(ok?'Верно! ⭐':'Попробуй ещё'); f.className='fb'+(ok?'':' bad'); } }
function nextBtn(){ return `<button class="primary" id="nx">Дальше →</button>`; }

// ---------- 2. WRITING (trace) ----------
const TRACE=['Р','и','м','В','а','р','я','Roma','Ciao','pizza','Варвара','gatto'];
function qWrite(){
  const L=lvl('write'); const pool = L===1?['а','у','а','у','ау','уа','А','У','ау','Ау!']:L===2?['ау','уа','ауа','Ау!','Рим','кот','Roma','Ciao','мама','папа']:['Варвара','ау-ау','gelato','grazie','Пиксель','fontana','аукает']; const word=pool[round%pool.length];
  body(`<div class="prompt">Обведи пальцем: <b style="font-family:var(--display);color:var(--terra)">${word}</b></div><canvas class="trace" id="cv" width="640" height="320"></canvas><div class="fb" id="fb"></div><div class="row"><button class="ghost" id="clr">Стереть</button><button class="primary" id="chk">Готово</button></div>`);
  const cv=$('#cv'), ctx=cv.getContext('2d');
  const fs = word.length>4 ? 150 : 230;
  const template=()=>{ ctx.clearRect(0,0,cv.width,cv.height); ctx.font=`800 ${fs}px "Baloo 2", sans-serif`; ctx.textAlign='center'; ctx.textBaseline='middle'; ctx.fillStyle='#E6F1F8'; ctx.fillText(word,320,165); ctx.strokeStyle='#9CC7E0'; ctx.lineWidth=3; ctx.setLineDash([10,8]); ctx.strokeText(word,320,165); ctx.setLineDash([]); };
  template();
  // mask of template for checking coverage
  const m=document.createElement('canvas'); m.width=640; m.height=320; const mc=m.getContext('2d'); mc.font=ctx.font; mc.textAlign='center'; mc.textBaseline='middle'; mc.fillStyle='#000'; mc.fillText(word,320,165);
  const mask=mc.getImageData(0,0,640,320).data;
  const strokes=document.createElement('canvas'); strokes.width=640; strokes.height=320; const sc=strokes.getContext('2d');
  let drawing=false, last=null;
  const pos=e=>{ const r=cv.getBoundingClientRect(); const p=e.touches?e.touches[0]:e; return [(p.clientX-r.left)*640/r.width,(p.clientY-r.top)*320/r.height]; };
  const start=e=>{drawing=true; last=pos(e); e.preventDefault();};
  const move=e=>{ if(!drawing) return; const p=pos(e); [ctx,sc].forEach(c=>{c.strokeStyle=c===ctx?'#D9603B':'#000'; c.lineWidth=22; c.lineCap='round'; c.lineJoin='round'; c.beginPath(); c.moveTo(...last); c.lineTo(...p); c.stroke();}); last=p; e.preventDefault(); };
  const end=()=>{drawing=false;};
  cv.addEventListener('pointerdown',start); cv.addEventListener('pointermove',move); window.addEventListener('pointerup',end);
  $('#clr').onclick=()=>{template(); sc.clearRect(0,0,640,320);};
  $('#chk').onclick=()=>{
    const d=sc.getImageData(0,0,640,320).data; let inM=0,hit=0,out=0;
    for(let i=3;i<mask.length;i+=4*3){ if(mask[i]>80){inM++; if(d[i]>80) hit++;} else if(d[i]>80) out++; }
    const cov=hit/Math.max(1,inM), spill=out/Math.max(1,hit+out);
    if(cov>0.45 && spill<0.6){ feedback(true,'Красиво написано! ⭐'); addStar('write'); round++; setTimeout(next,900); }
    else if(cov<0.1){ feedback(false,'Обведи буквы по пунктиру'); }
    else { feedback(false,'Почти! Обведи все буквы целиком'); }
  };
}

const PAIRS=[['pizza','PIZZA'],['gelato','GELATO'],['cat','GATTO'],['water','ACQUA'],['sun','SOLE'],['bread','PANE'],['house','CASA'],['dog','CANE'],['key','CHIAVE'],['wolf','LUPA']];
function qMemo(){
  const n = [4,6,8][lvl('memo')-1];
  const ps=shuffle(PAIRS).slice(0,n); const cards=shuffle(ps.flatMap(([ic,w],i)=>[{k:i,ic},{k:i,w}]));
  let open=[], done=0, moves=0;
  body(`<div class="small">Найди пару: картинка и слово</div><div class="mem" id="mem">${cards.map((c,i)=>`<button data-i="${i}"></button>`).join('')}</div><div class="fb" id="fb"></div>`);
  const btns=[...document.querySelectorAll('#mem button')];
  const reveal=(i,on)=>{ const c=cards[i]; btns[i].classList.toggle('open',on); btns[i].innerHTML = on ? (c.ic?I[c.ic]:c.w) : ''; };
  btns.forEach((b,i)=>b.onclick=()=>{
    if(open.length===2 || b.classList.contains('open') || b.classList.contains('done')) return;
    reveal(i,true); open.push(i);
    if(open.length===2){ moves++; const [a,c]=open;
      if(cards[a].k===cards[c].k){ open=[]; btns[a].classList.add('done'); btns[c].classList.add('done'); done++; if(done===n){ feedback(true,'Все пары найдены! ⭐'); addStar('memo', moves<=n+3?2:1); round=ROUNDS; setTimeout(next,1200);} }
      else setTimeout(()=>{reveal(a,false); reveal(c,false); open=[];},700);
    }

// ---------- 8. BLOCK BUILDER ----------
const BLOCKS=[['grass','Трава',0],['dirt','Земля',0],['stone','Камень',0],['plank','Доски',3],['brick','Кирпич',6],['water','Вода',10],['leaf','Листья',15],['sand','Песок',20],['gold','Золото',30],['lava','Лава',40]];
function tex(ctx,x,y,s,m){
  const px=(c,dx,dy,w=1,h=1)=>{ctx.fillStyle=c;ctx.fillRect(x+dx*s/8,y+dy*s/8,w*s/8,h*s/8);};
  const base={grass:'#6FA66B',dirt:'#8B5A2B',stone:'#8F8F8F',plank:'#C9A66B',brick:'#B5553A',water:'#5EAFD6',leaf:'#2E7D4F',sand:'#E9D28A',gold:'#F2B134',lava:'#E05A2B'}[m];
  ctx.fillStyle=base; ctx.fillRect(x,y,s,s);
  const r=(a,b)=>((x*7+y*13+a*3+b*5)%7); // deterministic noise
  if(m==='grass'){ for(let i=0;i<8;i++)for(let j=0;j<8;j++) if(r(i,j)<2) px('#5E9459',i,j); px('#8B5A2B',0,7,8,1); }
  if(m==='dirt'){ for(let i=0;i<8;i++)for(let j=0;j<8;j++) if(r(i,j)<2) px('#6E4520',i,j); }
  if(m==='stone'){ for(let i=0;i<8;i++)for(let j=0;j<8;j++) if(r(i,j)<2) px('#6E6E6E',i,j); else if(r(i,j)>5) px('#A8A8A8',i,j); }
  if(m==='plank'){ px('#8A5A2B',0,2,8,1); px('#8A5A2B',0,5,8,1); px('#8A5A2B',3,0,1,2); px('#8A5A2B',6,3,1,2); }
  if(m==='brick'){ px('#E8D5C0',0,2,8,1); px('#E8D5C0',0,5,8,1); px('#E8D5C0',3,0,1,2); px('#E8D5C0',6,3,1,2); px('#E8D5C0',1,6,1,2); }
  if(m==='water'){ px('#8ECAE6',1,1,3,1); px('#8ECAE6',4,4,3,1); px('#3F8FBF',0,6,8,1); }
  if(m==='leaf'){ for(let i=0;i<8;i++)for(let j=0;j<8;j++) if(r(i,j)<2) px('#1F5E36',i,j); else if(r(i,j)>5) px('#4CA86A',i,j); }
  if(m==='sand'){ for(let i=0;i<8;i++)for(let j=0;j<8;j++) if(r(i,j)<2) px('#D8BE6C',i,j); }
  if(m==='gold'){ px('#FFE38A',1,1,2,2); px('#FFE38A',5,4,2,2); px('#C78A00',0,7,8,1); px('#C78A00',7,0,1,8); }
  if(m==='lava'){ px('#FFD166',1,2,3,1); px('#FFD166',4,5,3,1); px('#B33A12',0,7,8,1); }
  ctx.strokeStyle='rgba(0,0,0,.25)'; ctx.lineWidth=1; ctx.strokeRect(x+.5,y+.5,s-1,s-1);
}
function qBuild(){
  const W=14,H=11,CS=40; let grid; try{grid=JSON.parse(localStorage.getItem('build')||'null');}catch(e){} if(!grid||grid.length!==H) grid=Array.from({length:H},(_,y)=>Array.from({length:W},()=>y>=8?'dirt':y===7?'grass':null));
  let curB='grass', placed=0;
  const avail=BLOCKS.filter(b=>S.total>=b[2]); const locked=BLOCKS.filter(b=>S.total<b[2]);
  body(`<div class="small">Строй свой блочный Рим: выбери блок и рисуй пальцем. Новые блоки открываются за звёзды</div><canvas class="trace" id="bc" width="${W*CS}" height="${H*CS}" style="border:3px solid #2B2A33;image-rendering:pixelated"></canvas><div class="bpal" id="bpal"></div><div class="row"><button class="ghost" id="erase">Ластик</button><button class="ghost" id="clear">Очистить</button><button class="primary" id="savebuild">Сохранить</button></div><div class="fb" id="fb"></div>`);
  const cv=$('#bc'), ctx=cv.getContext('2d');
  const draw=()=>{ ctx.fillStyle='#CFEAF7'; ctx.fillRect(0,0,cv.width,cv.height); for(let y=0;y<H;y++)for(let x=0;x<W;x++){ if(grid[y][x]) tex(ctx,x*CS,y*CS,CS,grid[y][x]); } ctx.strokeStyle='rgba(0,0,0,.06)'; for(let i=0;i<=W;i++){ctx.beginPath();ctx.moveTo(i*CS,0);ctx.lineTo(i*CS,H*CS);ctx.stroke();} };
  draw();
  const pal=$('#bpal');
  pal.innerHTML = avail.map(b=>`<button class="bb" data-b="${b[0]}"><canvas width="32" height="32"></canvas><span>${b[1]}</span></button>`).join('') + locked.map(b=>`<button class="bb lock" disabled><span style="font-size:18px">🔒</span><span>${b[1]}<br>★ ${b[2]}</span></button>`).join('');
  pal.querySelectorAll('.bb[data-b]').forEach(b=>{ tex(b.querySelector('canvas').getContext('2d'),0,0,32,b.dataset.b); b.onclick=()=>{curB=b.dataset.b; pal.querySelectorAll('.bb').forEach(x=>x.classList.toggle('on',x===b));}; });
  pal.querySelector('.bb').classList.add('on');
  let down=false;
  const cell=e=>{ const r=cv.getBoundingClientRect(); const x=Math.floor((e.clientX-r.left)/r.width*W), y=Math.floor((e.clientY-r.top)/r.height*H); return [x,y]; };
  const put=e=>{ const [x,y]=cell(e); if(x<0||y<0||x>=W||y>=H) return; if(grid[y][x]!==curB){ grid[y][x]=curB; placed++; draw(); } };
  cv.addEventListener('pointerdown',e=>{down=true; put(e); e.preventDefault();}); cv.addEventListener('pointermove',e=>{ if(down) put(e); }); window.addEventListener('pointerup',()=>{down=false; try{localStorage.setItem('build',JSON.stringify(grid));}catch(err){} });
  $('#erase').onclick=()=>{curB=null; pal.querySelectorAll('.bb').forEach(x=>x.classList.remove('on'));};
  $('#clear').onclick=()=>{ if($('#clear').dataset.s){ grid=grid.map(()=>Array(W).fill(null)); draw(); delete $('#clear').dataset.s; $('#clear').textContent='Очистить'; } else { $('#clear').dataset.s='1'; $('#clear').textContent='Точно?'; } };
  $('#savebuild').onclick=()=>{ try{localStorage.setItem('build',JSON.stringify(grid));}catch(err){} const n=grid.flat().filter(Boolean).length; if(placed>=30){ feedback(true,`Сохранено! Построено ${n} блоков ⭐`); addStar('build'); placed=0; } else feedback(true,`Сохранено: ${n} блоков. Поставь ещё ${30-placed}, чтобы получить звезду`); };
}

  const hand=(ang,len,w,col)=>{ c.beginPath(); c.moveTo(0,0); c.lineTo(Math.sin(ang)*len,-Math.cos(ang)*len); c.lineWidth=w; c.lineCap='round'; c.strokeStyle=col; c.stroke(); };
  hand((h%12+m/60)*Math.PI/6,70,12,'#2B2A33'); hand(m*Math.PI/30,105,7,'#2F8FBF'); c.fillStyle='#D9603B'; c.beginPath(); c.arc(0,0,9,0,7); c.fill();
  document.querySelectorAll('.opts button').forEach(b=>b.onclick=()=>{ const ok=b.dataset.v===fmt(h,m); b.classList.add(ok?'ok':'bad'); feedback(ok, ok?'Точно! ⭐':'Посмотри на короткую стрелку — это часы'); if(ok){addStar('clock'); round++; setTimeout(next,900);} });

    else if(L===2){ op=pick(['+','-']); a=Math.floor(Math.random()*18)+2; b=Math.floor(Math.random()*(op==='+'?20-a:a)); }

    const ans = op==='+'?a+b:op==='-'?a-b:a*b; const w=new Set(); while(w.size<3){ const d=ans+pick([-3,-2,-1,1,2,3,10,-10]); if(d>=0&&d!==ans) w.add(d); }

  body(`<div class="paid"><span>⏱ <b id="at">60</b> с</span><span>Очки: <b id="asc">0</b></span></div><div class="pb"><i id="apb" style="width:100%;background:var(--terra)"></i></div><div class="prompt big" id="aq"></div><div class="opts" id="ao" style="grid-template-columns:1fr 1fr"></div><div class="small">Неверный ответ отнимает 3 секунды</div>`);

  const stop=()=>clearInterval(timer); $('#back').addEventListener('click',stop,{once:true});

// ---------- 12. NUMBER BONDS (состав числа) ----------
function qBonds(){
  const L=lvl('bonds'); const maxN = L===1?6:L===2?10:20; const minN = L===1?3:L===2?5:11;
  const N = minN + Math.floor(Math.random()*(maxN-minN+1));
  const mode = round%3; // 0: fill the blank, 1: find all pairs, 2: pick the wrong house
  if(mode===0){
    const a = 1+Math.floor(Math.random()*(N-1)); const miss = Math.random()<.5 ? 'l':'r'; const ans = miss==='l'?a:N-a;
    const w=new Set(); while(w.size<3){ const d=ans+pick([-2,-1,1,2,3]); if(d>=0&&d<=N&&d!==ans) w.add(d); }
    body(`<div class="house"><div class="roof">${N}</div><div class="rooms"><div class="room">${miss==='l'?'<b>?</b>':a}</div><div class="plus">+</div><div class="room">${miss==='r'?'<b>?</b>':N-a}</div></div></div><div class="small">Какое число спряталось в домике?</div><div class="opts" style="grid-template-columns:1fr 1fr">${shuffle([ans,...w]).map(o=>`<button data-v="${o}">${o}</button>`).join('')}</div><div class="fb" id="fb"></div>`);
    document.querySelectorAll('.opts button').forEach(b=>b.onclick=()=>{ const ok=+b.dataset.v===ans; b.classList.add(ok?'ok':'bad'); feedback(ok, ok?`${N} = ${miss==='l'?ans:a} + ${miss==='l'?N-a:ans} ⭐`:'Посчитай: сколько не хватает до '+N+'?'); if(ok){addStar('bonds'); round++; setTimeout(next,1000);} });
  } else if(mode===1){
    const pairs=[]; for(let i=1;i<=Math.floor(N/2);i++) pairs.push([i,N-i]);
    const limit = L===3 ? 5 : pairs.length; const target = shuffle(pairs).slice(0,limit).sort((p,q)=>p[0]-q[0]);
    let found=new Set(); let sel=null;
    const nums = shuffle([...new Set(target.flat())]);
    body(`<div class="house"><div class="roof">${N}</div><div class="rooms" id="rooms">${target.map(()=>`<div class="pair"><span></span>+<span></span></div>`).join('')}</div></div><div class="small">Найди ${target.length} ${target.length===1?'пару':target.length<5?'пары':'пар'} чисел, которые вместе дают ${N}. Нажми два числа.</div><div class="row letters" id="nums">${nums.map(n=>`<button data-n="${n}">${n}</button>`).join('')}</div><div class="fb" id="fb"></div>`);
    const btns=[...document.querySelectorAll('#nums button')];
    const render=()=>{ [...document.querySelectorAll('#rooms .pair')].forEach((p,i)=>{ const f=[...found].map(k=>k.split('-').map(Number)).sort((x,y)=>x[0]-y[0])[i]; p.querySelectorAll('span')[0].textContent=f?f[0]:''; p.querySelectorAll('span')[1].textContent=f?f[1]:''; }); };
    btns.forEach(b=>b.onclick=()=>{ const n=+b.dataset.n;
      if(sel===null){ sel=n; b.classList.add('ok'); return; }
      const key=[Math.min(sel,n),Math.max(sel,n)].join('-'); btns.forEach(x=>x.classList.remove('ok'));
      if(sel+n===N && target.some(p=>p.join('-')===key) && !found.has(key)){ found.add(key); render(); feedback(true, `${sel} + ${n} = ${N} ✓`); if(found.size===target.length){ feedback(true,'Все пары найдены! ⭐⭐'); addStar('bonds',2); round++; setTimeout(next,1200);} }
      else if(sel+n===N) feedback(false,'Эта пара уже есть'); else feedback(false, `${sel} + ${n} = ${sel+n}, а нужно ${N}`);
      sel=null; });
  } else {
    const good=[]; for(let i=1;i<N;i++) good.push([i,N-i]);
    const g=shuffle(good).slice(0,3); let bad; do{ const a=1+Math.floor(Math.random()*(N-1)); const b=N-a+pick([-2,-1,1,2]); bad=[a,b]; }while(bad[1]<0||bad[0]+bad[1]===N);
    const all=shuffle([...g.map(p=>({p,ok:true})),{p:bad,ok:false}]);
    body(`<div class="house"><div class="roof">${N}</div></div><div class="small">Один домик построен неправильно. Найди его!</div><div class="opts" style="grid-template-columns:1fr 1fr">${all.map((x,i)=>`<button data-i="${i}" style="font-size:24px">${x.p[0]} + ${x.p[1]}</button>`).join('')}</div><div class="fb" id="fb"></div>`);
    document.querySelectorAll('.opts button').forEach(b=>b.onclick=()=>{ const x=all[+b.dataset.i]; const ok=!x.ok; b.classList.add(ok?'ok':'bad'); feedback(ok, ok?`Верно: ${x.p[0]} + ${x.p[1]} = ${x.p[0]+x.p[1]}, а не ${N} ⭐`:`Этот домик правильный: ${x.p[0]} + ${x.p[1]} = ${N}`); if(ok){addStar('bonds'); round++; setTimeout(next,1100);} });
  }
}

function roomScene(st){
  const [,,wA,wB]=WALLS2[st.wall], fl=FLOORS2[st.floor];
  let g=DEFS+`<linearGradient id="wg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${wA}"/><stop offset="1" stop-color="${wB}"/></linearGradient>`;
  g+=`<rect x="150" y="0" width="700" height="${HZ}" fill="url(#wg)"/>`;
  g+=`<path d="M0 0 L150 0 L150 ${HZ} L0 ${RH}z" fill="${wB}"/><path d="M1000 0 L850 0 L850 ${HZ} L1000 ${RH}z" fill="${wB}"/><path d="M1000 0 L850 0 L850 ${HZ} L1000 ${RH}z" fill="#000" opacity=".18"/>`;
  // cornice & ceiling line
  g+=`<rect x="150" y="0" width="700" height="22" fill="#F0E6D2"/><path d="M0 0 L150 0 L150 22 L0 32z M1000 0 L850 0 L850 22 L1000 32z" fill="#E6DED0"/><rect x="150" y="22" width="700" height="6" fill="#B9A98F"/>`;
  // dado & skirting
  g+=`<rect x="150" y="${HZ-78}" width="700" height="10" fill="#2B2A33" opacity=".35"/><rect x="150" y="${HZ-68}" width="700" height="52" fill="#000" opacity=".14"/><rect x="150" y="${HZ-16}" width="700" height="16" fill="#E6DED0"/><rect x="150" y="${HZ-4}" width="700" height="4" fill="#B9A98F"/>`;
  g+=`<path d="M0 ${RH} L150 ${HZ} L150 ${HZ-16} L0 ${RH-28}z M1000 ${RH} L850 ${HZ} L850 ${HZ-16} L1000 ${RH-28}z" fill="#E6DED0"/>`;
  if(st.wall===0||st.wall===1){ for(let x=190;x<850;x+=140) g+=`<rect x="${x}" y="60" width="90" height="${HZ-170}" fill="none" stroke="${st.wall===0?'#F2B134':'#7E241B'}" stroke-width="3" opacity=".6"/><rect x="${x+10}" y="70" width="70" height="${HZ-190}" fill="none" stroke="${st.wall===0?'#F2B134':'#7E241B'}" stroke-width="1.5" opacity=".4"/>`; }
  if(st.wall===2){ for(let x=150;x<850;x+=100) g+=`<path d="M${x} 28 v${HZ-44}" stroke="#B9A98F" stroke-width="2" opacity=".5"/>`; g+=`<path d="M150 ${HZ/2} h700" stroke="#B9A98F" stroke-width="2" opacity=".4"/>`; }
  if(st.wall===3){ for(let i=0;i<6;i++) g+=`<circle cx="${250+i*100}" cy="${100}" r="14" fill="#fff" opacity=".35"/>`; }
  // floor
  g+=`<path d="M150 ${HZ} L850 ${HZ} L1000 ${RH} L0 ${RH}z" fill="url(#${fl[0]})"/>`;
  for(let i=1;i<9;i++){ const t=i/9; const y=HZ+(RH-HZ)*t*t; const x0=150-150*t*t, x1=850+150*t*t; g+=`<path d="M${x0} ${y} L${x1} ${y}" stroke="rgba(0,0,0,.16)" stroke-width="2"/>`; }
  for(let i=0;i<=7;i++){ const u=i/7; g+=`<path d="M${150+700*u} ${HZ} L${1000*u} ${RH}" stroke="rgba(0,0,0,.12)" stroke-width="2"/>`; }
  // light shaft from left + ambient shading
  g+=`<path d="M150 ${HZ} L850 ${HZ} L1000 ${RH} L0 ${RH}z" fill="url(#wg)" opacity=".1"/><path d="M0 ${RH} L150 ${HZ} L420 ${HZ+40} L300 ${RH}z" fill="#fff" opacity=".07"/><path d="M850 ${HZ} L1000 ${RH} L1000 ${RH-80}z" fill="#000" opacity=".1"/>`;
  return g;
}
function qRoom(){
  let st; try{st=JSON.parse(localStorage.getItem('room3')||'null');}catch(e){} if(!st||!st.items) st={wall:0,floor:0,items:[{k:'window',x:500,y:180,s:1,f:1},{k:'door',x:230,y:150,s:1,f:1},{k:'rug',x:520,y:600,s:1.1,f:1},{k:'column',x:180,y:480,s:1,f:1},{k:'column',x:820,y:480,s:1,f:1},{k:'bed',x:520,y:560,s:1,f:1}]};
  let cur=null, placed=0, drag=null;
  const names=Object.entries(ITEMS2);
  body(`<div class="small">Нажми предмет внизу — он появится в комнате. Тяни пальцем. Нажми на предмет в комнате — появятся кнопки. Ковры лежат на полу, картины висят на стене, мебель стоит сверху.</div>
    <div class="scene" id="scene"><svg viewBox="0 0 ${RW} ${RH}" id="rsvg"></svg>
      <div class="itool" id="itool" hidden><button data-a="flip" title="Отразить">↔</button><button data-a="big" title="Больше">＋</button><button data-a="small" title="Меньше">－</button><button data-a="del" title="Убрать">✕</button></div></div>
    <div class="rowc"><span class="small">Стены:</span>${WALLS2.map((w,i)=>`<button class="swatch" data-w="${i}" title="${w[1]}" style="background:${w[2]}"></button>`).join('')}<span class="small" style="margin-left:6px">Пол:</span>${FLOORS2.map((f,i)=>`<button class="swatch" data-f="${i}" title="${f[1]}" style="background:${f[2]}"></button>`).join('')}</div>
    <div class="bpal" id="fpal">${names.map(([k,v])=>`<button class="bb" data-k="${k}"><svg viewBox="0 0 ${v[1]} ${v[2]}" preserveAspectRatio="xMidYMid meet">${DEFS}${v[4]}</svg><span>${v[0]}</span></button>`).join('')}</div>
    <div class="row"><button class="ghost" id="rclear">Очистить</button><button class="primary" id="rsave">Сохранить</button></div><div class="fb" id="fb"></div>`);
  const svg=$('#rsvg'), tool=$('#itool');
  const depth=y=> y<HZ ? 0.6+0.3*(y/HZ) : 0.7+0.95*((y-HZ)/(RH-HZ));
  const layerOf=it=>ITEMS2[it.k][3];
  const render=()=>{
    const order=[...st.items].sort((a,b)=>(layerOf(a)-layerOf(b))||(a.y-b.y));
    svg.innerHTML = roomScene(st) + order.map(it=>{ const i=st.items.indexOf(it); const [,w,h,layer,art]=ITEMS2[it.k]; const sc=depth(it.y)*it.s*0.85;
      const shadow = layer===2 ? `<ellipse cx="${w/2}" cy="${h-2}" rx="${w*0.46}" ry="${Math.max(6,w*0.08)}" fill="rgba(0,0,0,.25)"/>` : layer===1 ? `<rect x="6" y="8" width="${w}" height="${h}" fill="rgba(0,0,0,.22)"/>` : '';
      return `<g class="item${i===cur?' cur':''}" data-i="${i}" transform="translate(${it.x} ${it.y}) scale(${sc*it.f} ${sc}) translate(${-w/2} ${-h})">${shadow}${art}</g>`; }).join('');
    if(cur!==null){ const it=st.items[cur]; const r=svg.getBoundingClientRect(); const [,w,h]=ITEMS2[it.k]; tool.hidden=false; tool.style.left=(it.x/RW*r.width)+'px'; tool.style.top=Math.max(6,(it.y-depth(it.y)*it.s*0.85*h)/RH*r.height-44)+'px'; } else tool.hidden=true;
  };
  render();
  const pt=e=>{ const r=svg.getBoundingClientRect(); return [(e.clientX-r.left)/r.width*RW,(e.clientY-r.top)/r.height*RH]; };
  svg.addEventListener('pointerdown',e=>{ const g=e.target.closest('.item'); if(!g){ cur=null; render(); return; } cur=+g.dataset.i; const [x,y]=pt(e); const it=st.items[cur]; drag={dx:it.x-x,dy:it.y-y,id:it}; svg.setPointerCapture(e.pointerId); render(); e.preventDefault(); });
  svg.addEventListener('pointermove',e=>{ if(!drag) return; const [x,y]=pt(e); const it=drag.id; const L=layerOf(it); it.x=Math.max(30,Math.min(RW-30,x+drag.dx)); let ny=y+drag.dy; if(L===1) ny=Math.max(ITEMS2[it.k][2]*0.5+10,Math.min(HZ-6,ny)); else ny=Math.max(HZ+10,Math.min(RH-6,ny)); it.y=ny; render(); });
  const endDrag=()=>{ drag=null; }; svg.addEventListener('pointerup',endDrag); svg.addEventListener('pointercancel',endDrag);
  tool.onclick=e=>{ const b=e.target.closest('button'); if(!b||cur===null) return; const it=st.items[cur]; const a=b.dataset.a; if(a==='flip') it.f*=-1; if(a==='big') it.s=Math.min(2.4,it.s*1.15); if(a==='small') it.s=Math.max(.4,it.s/1.15); if(a==='del'){ st.items.splice(cur,1); cur=null; } render(); };
  document.querySelectorAll('#fpal .bb').forEach(b=>b.onclick=()=>{ const k=b.dataset.k; const L=ITEMS2[k][3]; st.items.push({k,x:500+Math.random()*200-100,y:L===1?150+Math.random()*80:L===0?HZ+200+Math.random()*120:HZ+140+Math.random()*200,s:1,f:1}); placed++; cur=st.items.length-1; render(); });
  document.querySelectorAll('.swatch[data-w]').forEach(b=>b.onclick=()=>{st.wall=+b.dataset.w; render();});
  document.querySelectorAll('.swatch[data-f]').forEach(b=>b.onclick=()=>{st.floor=+b.dataset.f; render();});
  $('#rclear').onclick=()=>{ if($('#rclear').dataset.s){ st.items=[]; cur=null; render(); delete $('#rclear').dataset.s; $('#rclear').textContent='Очистить'; } else { $('#rclear').dataset.s='1'; $('#rclear').textContent='Точно?'; } };
  $('#rsave').onclick=()=>{ try{localStorage.setItem('room3',JSON.stringify(st));}catch(e){} const n=st.items.length; if(placed>=10){ feedback(true,`Вилла готова: ${n} предметов ⭐`); addStar('room'); placed=0; } else feedback(true,`Сохранено (${n} предметов). Поставь ещё ${10-placed} — и будет звезда`); };
  $('#back').addEventListener('click',()=>{ try{localStorage.setItem('room3',JSON.stringify(st));}catch(e){} },{once:true});
}

// ---------- 14. CORNERS (уголки) ----------
function boardUI(title, onCell, opts){
  body(`<div class="paid"><span id="turnlab">${title}</span><span class="small" id="modelab"></span></div><div class="board8" id="b8"></div><div class="fb" id="fb"></div><div class="row"><button class="ghost" id="vs">${opts.vs}</button><button class="ghost" id="restart">Заново</button></div>`);
  const b=$('#b8'); for(let i=0;i<64;i++){ const d=document.createElement('div'); d.className='sq '+(((i>>3)+i)%2?'dark':'light'); d.dataset.i=i; b.appendChild(d); }
  b.onclick=e=>{ const c=e.target.closest('.sq'); if(c) onCell(+c.dataset.i); };
  return b;
}
function qCorners(){
  const N=8; let vsAI=true, turn=1, sel=null, moves=[], over=false;
  const start=()=>{ const g=Array(64).fill(0); for(let r=0;r<3;r++)for(let c=0;c<3;c++){ g[(7-r)*8+c]=1; g[r*8+(7-c)]=2; } return g; };
  let g=start();
  const home1=[...Array(9)].map((_,k)=>(7-Math.floor(k/3))*8+(k%3)), home2=[...Array(9)].map((_,k)=>Math.floor(k/3)*8+(7-k%3));
  const target=p=>p===1?home2:home1;
  const reach=(from)=>{ const res=new Map(); const r0=from>>3,c0=from&7; [[1,0],[-1,0],[0,1],[0,-1]].forEach(([dr,dc])=>{ const r=r0+dr,c=c0+dc; if(r>=0&&r<8&&c>=0&&c<8&&!g[r*8+c]) res.set(r*8+c,[r*8+c]); });
    const seen=new Set([from]); const q=[[from,[]]]; while(q.length){ const [p,path]=q.shift(); const r=p>>3,c=p&7; [[1,0],[-1,0],[0,1],[0,-1]].forEach(([dr,dc])=>{ const mr=r+dr,mc=c+dc,lr=r+2*dr,lc=c+2*dc; if(lr>=0&&lr<8&&lc>=0&&lc<8&&g[mr*8+mc]&&!g[lr*8+lc]&&!seen.has(lr*8+lc)){ seen.add(lr*8+lc); const np=[...path,lr*8+lc]; res.set(lr*8+lc,np); q.push([lr*8+lc,np]); } }); } return res; };
  const won=p=>{ const T=target(p); const mine=T.filter(i=>g[i]===p).length, theirs=T.filter(i=>g[i]===3-p).length; return mine>0 && mine===9-theirs; };
  const dist=(i,p)=>{ const r=i>>3,c=i&7; return p===1? (r)+(7-c) : (7-r)+c; };
  const b=boardUI('Ход: красные (ты)', onCell, {vs:'Режим: против компьютера'});
  const render=()=>{ [...b.children].forEach((d,i)=>{ d.innerHTML=g[i]?`<span class="pc p${g[i]}"></span>`:''; d.classList.toggle('sel',i===sel); d.classList.toggle('hint',moves.some(m=>m[0]===i)); d.classList.toggle('goal',target(turn).includes(i)&&!g[i]); }); $('#turnlab').textContent= over?'Игра окончена':(turn===1?'Ход: красные'+(vsAI?' (ты)':''):'Ход: синие'+(vsAI?' (компьютер)':'')); $('#modelab').textContent=vsAI?'против компьютера':'вдвоём'; };
  function onCell(i){ if(over) return; if(vsAI&&turn===2) return;
    if(g[i]===turn){ sel=i; moves=[...reach(i).entries()]; render(); return; }
    const m=moves.find(x=>x[0]===i); if(sel!==null&&m){ g[i]=turn; g[sel]=0; sel=null; moves=[]; after(); } }
  const after=()=>{ if(won(turn)){ over=true; render(); const me=turn===1; feedback(me,'Победили '+(turn===1?'красные':'синие')+'! '+(me?'⭐⭐⭐':'')); if(me) addStar('corners', vsAI?3:1); return; } turn=3-turn; render(); if(vsAI&&turn===2) setTimeout(aiMove,500); };
  const aiMove=()=>{ let best=null,bs=-1e9; const stillHome=home2.filter(i=>g[i]===2).length; for(let i=0;i<64;i++){ if(g[i]!==2) continue; for(const [to] of reach(i)){ let sc=(dist(i,2)-dist(to,2))*1.5; if(home2.includes(i)&&!home2.includes(to)) sc+=6; if(home2.includes(to)) sc-=8; if(home1.includes(to)) sc+=4; if(home1.includes(i)&&!home1.includes(to)) sc-=20; if(stillHome>0&&!home2.includes(i)) sc-=2; sc+=Math.random()*0.4; if(sc>bs){bs=sc;best=[i,to];} } } if(!best){ feedback(false,'У компьютера нет ходов — твой ход'); turn=1; render(); return; } g[best[1]]=2; g[best[0]]=0; after(); };
  $('#vs').onclick=()=>{ vsAI=!vsAI; $('#vs').textContent=vsAI?'Режим: против компьютера':'Режим: вдвоём'; render(); if(vsAI&&turn===2) setTimeout(aiMove,400); };
  $('#restart').onclick=()=>{ g=start(); turn=1; sel=null; moves=[]; over=false; feedback(true,''); render(); };
  feedback(true,'Переведи свои фишки в противоположный угол: шаг на соседнюю клетку или прыжки через фишки (цепочкой). Фишки соперника, которые так и не вышли из своего угла, засчитываются тебе.'); $('#fb').className='fb small';
  render();
}

// ---------- 15. PAWN BATTLE ----------
function qPawns(){
  let vsAI=true, turn=1, sel=null, moves=[], over=false, ep=-1;
  const start=()=>{ const g=Array(64).fill(0); for(let c=0;c<8;c++){ g[6*8+c]=1; g[1*8+c]=2; } return g; };
  let g=start();
  const legal=(i,p)=>{ const r=i>>3,c=i&7, d=p===1?-1:1, out=[]; const r1=r+d; if(r1<0||r1>7) return out; if(!g[r1*8+c]){ out.push([r1*8+c,'m']); const r2=r+2*d; if(((p===1&&r===6)||(p===2&&r===1))&&!g[r2*8+c]) out.push([r2*8+c,'d']); } [-1,1].forEach(dc=>{ const cc=c+dc; if(cc<0||cc>7) return; const t=r1*8+cc; if(g[t]&&g[t]!==p) out.push([t,'x']); if(ep===t&&g[r*8+cc]===3-p) out.push([t,'e']); }); return out; };
  const allMoves=p=>{ const a=[]; for(let i=0;i<64;i++) if(g[i]===p) legal(i,p).forEach(m=>a.push([i,...m])); return a; };
  const b=boardUI('Ход: белые (ты)', onCell, {vs:'Режим: против компьютера'});
  const render=()=>{ [...b.children].forEach((d,i)=>{ d.innerHTML=g[i]?`<span class="pawn ${g[i]===1?'w':'bk'}">${I.pawn}</span>`:''; d.classList.toggle('sel',i===sel); d.classList.toggle('hint',moves.some(m=>m[0]===i)); }); $('#turnlab').textContent= over?'Игра окончена':(turn===1?'Ход: белые'+(vsAI?' (ты)':''):'Ход: чёрные'+(vsAI?' (компьютер)':'')); $('#modelab').textContent=vsAI?'против компьютера':'вдвоём'; };
  const apply=(from,to,kind,p)=>{ if(kind==='e') g[(from>>3)*8+(to&7)]=0; g[to]=p; g[from]=0; ep = kind==='d' ? (from+to)/2 : -1; };
  function onCell(i){ if(over||(vsAI&&turn===2)) return; if(g[i]===turn){ sel=i; moves=legal(i,turn); render(); return; } const m=moves.find(x=>x[0]===i); if(sel!==null&&m){ apply(sel,i,m[1],turn); sel=null; moves=[]; after(); } }
  const after=()=>{ const p=turn; const reached = p===1 ? g.slice(0,8).includes(1) : g.slice(56).includes(2); const oppHas = g.includes(3-p); const oppMoves = allMoves(3-p).length;
    if(reached||!oppHas||!oppMoves){ over=true; render(); const me=p===1; feedback(me, (p===1?'Белые':'Чёрные')+' победили! '+(reached?'Пешка дошла до края.':!oppHas?'У соперника не осталось пешек.':'Сопернику некуда ходить.')+(me?' ⭐⭐⭐':'')); if(me) addStar('pawns', vsAI?3:1); return; }
    turn=3-turn; render(); if(vsAI&&turn===2) setTimeout(aiMove,500); };
  const aiMove=()=>{ const ms=allMoves(2); if(!ms.length){ turn=1; render(); return; } const attacked=t=>{ const r=t>>3,c=t&7; return [-1,1].some(dc=>{ const cc=c+dc; return cc>=0&&cc<8&&g[(r+1)*8+cc]===1; }); };
    const score=m=>{ const [from,to,k]=m; let s=Math.random(); if(k==='x'||k==='e') s+=5; if((to>>3)===7) s+=100; if(attacked(to)) s-=4; s+=(to>>3)*0.6; const safeNow=!attacked(from); if(safeNow&&attacked(to)) s-=2; return s; };
    const best=ms.sort((a,c)=>score(c)-score(a))[0]; apply(best[0],best[1],best[2],2); after(); };
  $('#vs').onclick=()=>{ vsAI=!vsAI; $('#vs').textContent=vsAI?'Режим: против компьютера':'Режим: вдвоём'; render(); if(vsAI&&turn===2) setTimeout(aiMove,400); };
  $('#restart').onclick=()=>{ g=start(); turn=1; sel=null; moves=[]; over=false; ep=-1; feedback(true,''); render(); };
  feedback(true,'Пешки ходят вперёд на 1 (с начала — на 2), бьют наискосок. Побеждает тот, кто первым дойдёт до края доски или съест всех.'); $('#fb').className='fb small';
  render();
}

function burst(){ const c=$('#confetti'); const cols=['#D9603B','#F2B134','#2F8FBF','#6FA66B','#8A3A62']; for(let i=0;i<24;i++){ const s=document.createElement('i'); s.style.left=Math.random()*100+'vw'; s.style.background=pick(cols); s.style.animationDelay=(Math.random()*.3)+'s'; c.appendChild(s); setTimeout(()=>s.remove(),2000);} }

document.addEventListener('click',e=>{ if(e.target.id==='nx') next(); });
renderHub();
